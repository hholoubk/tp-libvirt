- vIOMMU.smmuv3_auto_properties:
    type = smmuv3_auto_properties
    only aarch64
    start_vm = "no"
    ping_dest = '8.8.8.8'
    smmu_device_id = smmuv3.0
    expected_smmu_props = {'ats': 'off', 'ril': 'on', 'oas': '44', 'ssidsize': '0'}
    interface_driver = {'driver_attr': {'name': 'vhost', 'iommu': 'on'}}
    iface_dict = {'type_name': 'network', 'model': 'virtio', 'driver': ${interface_driver}, 'source': {'network': 'default'}}
    variants:
        - explicit_auto:
            use_libvirt_iommu = "no"
            smmu_device_args = "arm-smmuv3,primary-bus=pcie.0,id=smmuv3.0,accel=off,ats=auto,ril=auto,oas=auto,ssidsize=auto"
        - default_auto:
            use_libvirt_iommu = "no"
            smmu_device_args = "arm-smmuv3,primary-bus=pcie.0,id=smmuv3.0,accel=off"
        - machine_wide:
            use_libvirt_iommu = "yes"
            func_supported_since_libvirt_ver = (5, 5, 0)
            iommu_dict = {'model': 'smmuv3'}
